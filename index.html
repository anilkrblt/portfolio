<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe4" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Resolve the theme before first paint so the paper canvas never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('ak_theme');
          var theme = stored === 'gece' || stored === 'kagit' ? stored : 'kagit';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === 'gece' ? '#14120f' : '#f4efe4';
        } catch (e) {
          document.documentElement.dataset.theme = 'kagit';
        }
      })();
    </script>
    <meta
      name="description"
      content="Fikirden üretim dağıtımına kadar uçtan uca full-stack ürünler geliştiren yazılım mühendisi Anıl Karabulut."
    />
    <meta name="author" content="Anıl Karabulut" />
    <link rel="canonical" href="https://portfolio-9ein.onrender.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
